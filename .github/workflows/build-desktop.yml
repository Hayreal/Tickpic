name: Build Desktop

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub Release with installers
        type: boolean
        default: true
      release_tag:
        description: Release tag (e.g. v0.0.1). Leave empty to use package.json version.
        required: false
        type: string

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            script: dist:win
            artifact_paths: release/*.exe
          - os: macos-latest
            platform: macos
            script: dist:mac
            artifact_paths: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      # Unsigned macOS builds for CI artifacts.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # Force official Electron / electron-builder CDN (repo .npmrc uses npmmirror for local dev).
      ELECTRON_MIRROR: ''
      ELECTRON_BUILDER_BINARIES_MIRROR: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use official Electron CDN in CI
        shell: bash
        run: |
          cat > .npmrc <<'EOF'
          # Use official Electron CDN on GitHub Actions (override repo mirror settings).
          electron_mirror=
          ELECTRON_MIRROR=
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm ${{ matrix.script }}
        env:
          ELECTRON_MIRROR: ''
          ELECTRON_BUILDER_BINARIES_MIRROR: ''
          npm_config_electron_mirror: ''

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tickpic-${{ matrix.platform }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.ref_name }}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              VERSION=$(node -p "require('./package.json').version")
              TAG="v${VERSION}"
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tickpic-*
          merge-multiple: true
          path: release-assets

      - name: List release files
        shell: bash
        run: find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.zip
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
